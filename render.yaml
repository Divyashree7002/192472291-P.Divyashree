services:
  # ----------------------------------------------------
  # 1. FastAPI Python Backend Web Service
  # ----------------------------------------------------
  - type: web
    name: smartspace-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: SMARTSPACE_JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        value: admin@smartspace.ai
      - key: INITIAL_ADMIN_PASSWORD
        value: Admin@12345
      - key: INITIAL_RESEARCH_EMAIL
        value: research@smartspace.ai
      - key: INITIAL_RESEARCH_PASSWORD
        value: Research@SmartSpace2026!
      - key: INITIAL_USER_EMAIL
        value: user@smartspace.ai
      - key: INITIAL_USER_PASSWORD
        value: User@SmartSpace2026!

  # ----------------------------------------------------
  # 2. React + Vite Frontend Static Site
  # ----------------------------------------------------
  - type: static
    name: smartspace-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smartspace-backend
          property: host
